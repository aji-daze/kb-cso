name: update-data

on:
  schedule:
    # 日本時間 平日 8:30〜15:30 の30分毎（cronはUTC表記のためJST-9時間）
    - cron: "30 23 * * 0-4"
    - cron: "0,30 0-6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install deps
        run: pip install yfinance cryptography
      - name: write portfolio.json from secret
        env:
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
        run: printf '%s' "$PORTFOLIO_JSON" > portfolio.json
      - name: build encrypted data
        env:
          DATA_PIN: ${{ secrets.DATA_PIN }}
        run: python cloud_publish.py
      - name: commit & push
        run: |
          git config user.name "data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.enc.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "data update"
          git push
