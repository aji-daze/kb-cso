name: wataamemo-apk

# wataamemo の Android アプリ（android-memo/）を作る。画面は docs/memo を同梱するので、
# 画面を直したときも作り直す。main に入ったら、Releases の「wataamemo」に最新の APK を置く。
# スマホからは次の固定リンクで落とせる:
#   https://github.com/aji-daze/kb-cso/releases/download/wataamemo/wataamemo.apk

on:
  push:
    branches: ["**"]
    paths:
      - "android-memo/**"
      - "docs/memo/**"
      - ".github/workflows/wataamemo-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-memo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ランナーには Android SDK が最初から入っている（android.yml と同じ）
      - name: build apk
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: rename
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/wataamemo.apk
          ls -la out

      # 画面が同梱されていること・固定の鍵で署名されていること（上書きで更新できる条件）を確かめる
      - name: check apk
        run: |
          unzip -l out/wataamemo.apk | grep -E "assets/memo/(index.html|sync.js)"
          n=$(unzip -l out/wataamemo.apk | grep -cE "assets/memo/(index.html|sync.js|manifest.json)")
          test "$n" = 3
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$signer" verify --print-certs out/wataamemo.apk | tee signer.txt
          grep -qi "SHA-256 digest: b70e5520bcd31c9e5df258e419c32ca7b0ed56378c1d324e56363030fc64a074" signer.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wataamemo-apk
          path: android-memo/out/wataamemo.apk
          if-no-files-found: error

      # main のときだけ、Releases の「wataamemo」の APK を差し替える（リンクは変わらない）
      - name: release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view wataamemo >/dev/null 2>&1; then
            gh release create wataamemo --title "wataamemo（Android）" --latest=false \
              --notes "スマホで開いてダウンロード → インストール。上書きで更新できる（署名鍵は固定）。"
          fi
          gh release upload wataamemo out/wataamemo.apk --clobber
          gh release edit wataamemo --notes "最新: ${GITHUB_SHA::7}（$(date -u +%Y-%m-%d)）。スマホで開いて wataamemo.apk をダウンロード → インストール。上書きで更新できる（署名鍵は固定）。"
