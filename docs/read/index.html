<!doctype html>
<html lang="ja" data-theme="sumi" data-accent="kohaku" data-font="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0b0b0d">
<meta name="description" content="読むための画面と読んだ記録を1つにした、個人用の読書 PWA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>ぽちゃ文庫</title>
</head>
<body>

<header id="top">
  <button class="ico" id="btn-back" hidden aria-label="戻る">‹</button>
  <button class="ico" id="btn-search" aria-label="探す">⌕</button>
  <h1 id="top-title">ぽちゃ文庫</h1>
  <button class="ico" id="btn-gear" aria-label="設定">⚙</button>
</header>

<main id="main">
  <section class="view" id="v-now"></section>
  <section class="view" id="v-shelf" hidden></section>
  <section class="view" id="v-notes" hidden></section>
  <section class="view" id="v-log" hidden></section>
</main>

<nav id="tabs">
  <button data-view="now" aria-current="true">
    <svg viewBox="0 0 24 24"><path d="M4 5h11a3 3 0 0 1 3 3v11M4 5v11a3 3 0 0 0 3 3h11"/></svg>つづき</button>
  <button data-view="shelf">
    <svg viewBox="0 0 24 24"><path d="M5 4h4v16H5zM11 4h3v16h-3zM16.5 5l3.5 14.5-3 .5L13.5 5.5z"/></svg>棚</button>
  <button data-view="notes">
    <svg viewBox="0 0 24 24"><path d="M6 4h9l4 4v12H6zM15 4v4h4M9 12h7M9 16h5"/></svg>抜き書き</button>
  <button data-view="log">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V5M16 20v-7M22 20H3"/></svg>記録</button>
</nav>

<!-- ================= 読書画面 ================= -->
<div id="reader" hidden data-dirmode="v" data-style="ja" data-anim="fade">
  <div class="rline"><i id="rbar"></i></div>
  <div class="stage" id="stage">
    <div class="rpage" id="rpage"><div id="rflow" data-dir="v"></div><div class="seam" id="seam"></div></div>
    <div class="gutterfx"></div>
    <div class="grain"></div>
    <div class="zones">
      <button id="z-a" aria-label="ページを送る"></button>
      <button id="z-ui" aria-label="操作を出す"></button>
      <button id="z-b" aria-label="ページを送る"></button>
    </div>

    <div class="rui top" id="rtop" hidden>
      <button class="rbtn" id="r-close">棚へ</button>
      <b id="r-title"></b>
      <button class="rbtn" id="r-toc">目次</button>
    </div>

    <div class="rui bottom" id="rbot" hidden></div>

    <div id="toc" hidden></div>

    <div id="selbar" hidden>
      <button id="sel-note">抜き書きにする</button>
      <button id="sel-cancel">やめる</button>
    </div>
  </div>
  <div class="rfoot">
    <span id="r-chap"></span>
    <span id="r-left"></span>
  </div>
</div>

<input type="file" id="pick" hidden multiple accept=".epub,.md,.markdown,.txt,.text,.zip,application/epub+zip,application/zip,text/plain,text/markdown">
<input type="file" id="pickdir" hidden multiple webkitdirectory directory>

<script type="module" src="js/app.js"></script>
</body>
</html>
