<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MEMO">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="description" content="開いた瞬間に書ける、最小のメモ">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>MEMO</title>
<!-- 速さのために CSS も JS もこのファイルに直書きする。外部ファイル・フォント・ライブラリは読まない。 -->
<style>
:root{--bg:#0e0e0e;--fg:#d8d8d4;--sub:#5c5c5a;--faint:#2a2a29;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#fafaf8;--fg:#222;--sub:#a3a3a0;--faint:#ececea;color-scheme:light}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:17px/1.85 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;letter-spacing:.02em;
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
::selection{background:var(--faint)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;display:block}
.bar{display:flex;align-items:center;height:52px;padding:0 max(11px,calc((100% - 660px)/2 - 13px));flex:none;transition:opacity .6s}
.bar button{width:44px;height:44px;display:grid;place-items:center;color:var(--sub);transition:color .2s}
.bar button:hover,.bar button:active{color:var(--fg)}
body.w .bar{opacity:0;transition:opacity 1.2s}
#st{flex:1;text-align:center;font-size:11px;letter-spacing:.12em;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
#ed{flex:1;width:100%;resize:none;border:0;outline:0;background:transparent;color:inherit;font:inherit;letter-spacing:inherit;caret-color:var(--fg);
  padding:8px max(24px,calc((100% - 660px)/2)) 45vh;tab-size:4}
#ed::placeholder{color:var(--sub)}
#dr{position:fixed;inset:0;z-index:9;visibility:hidden;background:var(--bg);opacity:0;transition:opacity .18s,visibility 0s .18s}
#dr.on{visibility:visible;opacity:1;transition:opacity .18s}
#pn{height:100%;max-width:660px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) max(24px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(24px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:8px;height:52px;flex:none;margin-top:16px}
#q{flex:1;min-width:0;padding:6px 0;border:0;border-bottom:1px solid var(--faint);background:none;color:inherit;font:inherit;letter-spacing:inherit;outline:0;border-radius:0;-webkit-appearance:none}
#q:focus{border-color:var(--sub)}
#q::placeholder{color:var(--sub)}
#q::-webkit-search-cancel-button{display:none}
#bX{width:44px;height:44px;display:grid;place-items:center;color:var(--sub);margin-right:-12px}
#bX:hover{color:var(--fg)}
#ls{flex:1;overflow:auto;list-style:none;padding:24px 0;scrollbar-width:none}
#ls li{padding:12px 0;cursor:pointer;color:var(--sub);transition:color .15s}
#ls li:hover{color:var(--fg)}
#ls b{display:block;font-weight:400;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ls small{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ls .none{cursor:default;font-size:13px}
.ft{display:flex;gap:24px;padding:16px 0 24px;font-size:12px;letter-spacing:.08em}
.ft button{color:var(--sub)}
.ft button:hover{color:var(--fg)}
#to{position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12px;letter-spacing:.08em;color:var(--sub);
  display:none;z-index:10;gap:16px;white-space:nowrap}
#to.on{display:flex}
#to button{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<div class="bar">
  <button id="bL" title="一覧 (Ctrl/⌘+K)" aria-label="一覧"><svg viewBox="0 0 24 24"><path d="M5 8h14M5 16h9"/></svg></button>
  <button id="bN" title="新しいメモ (Alt+N)" aria-label="新しいメモ"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
  <div id="st"></div>
  <button id="bS" title="共有・コピー" aria-label="共有・コピー"><svg viewBox="0 0 24 24"><path d="M12 15V5M8 9l4-4 4 4M6 14v5h12v-5"/></svg></button>
  <button id="bD" title="このメモを削除" aria-label="削除"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
</div>
<textarea id="ed" autofocus spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
<div id="dr"><div id="pn">
  <div class="top"><input id="q" type="search" placeholder="検索" autocomplete="off"><button id="bX" title="閉じる (Esc)" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
  <ul id="ls"></ul>
  <div class="ft">
    <button id="bE">書き出し</button>
    <button id="bI">読み込み</button>
  </div>
</div></div>
<div id="to"><span id="tm"></span><button id="tu" hidden>元に戻す</button></div>
<script>
// 起動時にやるのは「空の入力欄にカーソルを置く」ことだけ。
// 保存データは1件ずつ別キー（memo:<id>）にあるので、一覧を開くまで読まない。
(function(){
'use strict';
var P='memo:',LS=localStorage,$=function(i){return document.getElementById(i)};
var ed=$('ed'),st=$('st'),dr=$('dr'),q=$('q'),ls=$('ls'),to=$('to');
var cur=null,saved='',timer=0,toT=0,undo=null;

ed.focus();

function nid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function get(id){try{return JSON.parse(LS.getItem(P+id))}catch(e){return null}}
function all(){
  var a=[];
  for(var i=0;i<LS.length;i++){var k=LS.key(i);if(k&&k.indexOf(P)===0){var m=get(k.slice(P.length));if(m&&typeof m.t==='string'){m.id=k.slice(P.length);a.push(m)}}}
  return a.sort(function(x,y){return y.u-x.u});
}
function fmt(ms){
  var d=new Date(ms),n=new Date(),p=function(v){return(v<10?'0':'')+v};
  var hm=p(d.getHours())+':'+p(d.getMinutes());
  if(d.toDateString()===n.toDateString())return hm;
  return(d.getFullYear()===n.getFullYear()?'':d.getFullYear()+'/')+(d.getMonth()+1)+'/'+d.getDate()+' '+hm;
}
function status(){
  var n=ed.value.length;
  st.textContent=(n?n+'字':'')+(cur&&get(cur)?(n?' · ':'')+fmt(get(cur).u):'');
}

// 保存。中身が空になったメモは消す（空メモを溜めない）。
function save(){
  clearTimeout(timer);timer=0;
  var t=ed.value;
  if(t===saved)return;
  if(!t.trim()){if(cur)LS.removeItem(P+cur);cur=null;saved=t;status();return}
  var now=Date.now(),old=cur&&get(cur);
  if(!cur)cur=nid();
  try{LS.setItem(P+cur,JSON.stringify({t:t,c:old?old.c:now,u:now}));saved=t}
  catch(e){toast('保存できません（容量不足）。書き出してから古いメモを消してください')}
  status();
}
function later(){clearTimeout(timer);timer=setTimeout(save,250)}

function open(id){
  save();
  var m=id&&get(id);
  cur=m?id:null;saved=m?m.t:'';
  ed.value=saved;ed.setSelectionRange(0,0);ed.scrollTop=0;
  status();close();ed.focus();
}

function toast(msg,fn){
  $('tm').textContent=msg;$('tu').hidden=!fn;undo=fn||null;to.className='on';
  clearTimeout(toT);toT=setTimeout(function(){to.className='';undo=null},fn?5000:2500);
}

// 一覧
function render(){
  var w=q.value.trim().toLowerCase(),a=all(),h='',n=0;
  for(var i=0;i<a.length;i++){
    var t=a[i].t;if(w&&t.toLowerCase().indexOf(w)<0)continue;
    var lines=t.trim().split('\n'),head=lines[0].slice(0,80),rest=lines.slice(1).join(' ').trim().slice(0,80);
    h+='<li data-id="'+a[i].id+'"'+(a[i].id===cur?' class="cur"':'')+'><b></b><small></small></li>';
    a[i]._h=head;a[i]._r=fmt(a[i].u)+(rest?'　'+rest:'');n++;
  }
  ls.innerHTML=n?h:'<li class="none">'+(w?'見つかりません':'メモはまだありません')+'</li>';
  // 本文は textContent で入れる（HTML として解釈させない）
  var li=ls.children,j=0;
  for(i=0;i<a.length&&j<li.length;i++){if('_h' in a[i]){li[j].firstChild.textContent=a[i]._h;li[j].lastChild.textContent=a[i]._r;j++}}
}
function openList(){save();wake();q.value='';render();dr.className='on';if(matchMedia('(hover:hover)').matches)q.focus()}
function close(){dr.className=''}

ed.addEventListener('input',function(){later();st.textContent=ed.value.length+'字';quiet()});
// 書いている間はバーを消して文字だけにする。手が止まるかマウスが動けば戻す。
var wT=0,mx=-1,my=-1,B=document.body;
function quiet(){B.classList.add('w');clearTimeout(wT);wT=setTimeout(wake,1500)}
function wake(){clearTimeout(wT);B.classList.remove('w')}
addEventListener('mousemove',function(e){if(Math.abs(e.screenX-mx)+Math.abs(e.screenY-my)>4&&mx>=0)wake();mx=e.screenX;my=e.screenY});
$('bL').onclick=openList;
$('bX').onclick=function(){close();ed.focus()};
$('bN').onclick=function(){open(null)};
$('bD').onclick=function(){
  save();
  if(!cur){ed.value='';saved='';status();ed.focus();return}
  var id=cur,m=get(id);LS.removeItem(P+id);open(null);
  toast('削除しました',function(){LS.setItem(P+id,JSON.stringify(m));open(id)});
};
$('tu').onclick=function(){if(undo)undo();to.className='';undo=null};
$('bS').onclick=function(){
  var t=ed.value;if(!t)return;
  if(navigator.share&&matchMedia('(pointer:coarse)').matches){navigator.share({text:t}).catch(function(){})}
  else if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){toast('コピーしました')},function(){toast('コピーできませんでした')})}
};
dr.onclick=function(e){if(e.target===dr)close()};
q.oninput=render;
q.onkeydown=function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();var f=ls.querySelector('li[data-id]');if(f)open(f.getAttribute('data-id'))}};
ls.onclick=function(e){var li=e.target.closest('li[data-id]');if(li)open(li.getAttribute('data-id'))};

$('bE').onclick=function(){
  var a=all().map(function(m){return{id:m.id,t:m.t,c:m.c,u:m.u}});
  var b=new Blob([JSON.stringify({app:'memo',v:1,memos:a},null,1)],{type:'application/json'});
  var x=document.createElement('a'),d=new Date();
  x.href=URL.createObjectURL(b);x.download='memo-'+d.getFullYear()+(d.getMonth()+101+'').slice(1)+(d.getDate()+100+'').slice(1)+'.json';
  x.click();setTimeout(function(){URL.revokeObjectURL(x.href)},1000);
};
$('bI').onclick=function(){
  var f=document.createElement('input');f.type='file';f.accept='.json,.txt,.md,application/json,text/plain';
  f.onchange=function(){
    var file=f.files[0];if(!file)return;
    file.text().then(function(s){
      var n=0,now=Date.now();
      try{
        var d=JSON.parse(s),a=Array.isArray(d)?d:d.memos;
        a.forEach(function(m){
          if(!m||typeof m.t!=='string'||!m.t.trim())return;
          var id=m.id||nid(),ex=get(id);
          if(ex&&ex.u>=(m.u||0))return; // 手元の方が新しければ上書きしない
          LS.setItem(P+id,JSON.stringify({t:m.t,c:m.c||now,u:m.u||now}));n++;
        });
      }catch(e){
        if(!s.trim())return;
        LS.setItem(P+nid(),JSON.stringify({t:s,c:now,u:now}));n=1; // 普通のテキストは1件のメモとして取り込む
      }
      render();toast(n+'件読み込みました');
    });
  };
  f.click();
};

document.addEventListener('keydown',function(e){
  var mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(mod&&k==='k'){e.preventDefault();dr.className?(close(),ed.focus()):openList()}
  else if(mod&&k==='s'){e.preventDefault();save();toast('保存しました')}
  else if(e.altKey&&(k==='n'||e.code==='KeyN')){e.preventDefault();open(null)}
  else if(k==='escape'&&dr.className){close();ed.focus()}
});
// Tab でフォーカスを逃がさず字下げを入れる
ed.addEventListener('keydown',function(e){
  if(e.key==='Tab'&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();document.execCommand('insertText',false,'\t')}
});

// 閉じる・裏に回る瞬間に必ず書き込む
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',function(){if(document.hidden)save()});
// 別タブで同じメモが書き換わったら、こちらが未編集のときだけ追従する
addEventListener('storage',function(e){
  if(!cur||e.key!==P+cur||ed.value!==saved)return;
  var m=get(cur);if(!m){cur=null;saved='';ed.value=''}else{saved=m.t;ed.value=m.t}status();
});

// Service Worker は描画が終わってから。起動の邪魔をしない。
if('serviceWorker' in navigator)addEventListener('load',function(){setTimeout(function(){navigator.serviceWorker.register('sw.js').catch(function(){})},1000)});
})();
</script>
</body>
</html>
