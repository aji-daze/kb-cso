<head>

<!-- 速さのために CSS も JS もこのファイルに直書きする。外部ファイル・フォント・ライブラリは読まない。 -->
<style>
:root{--bg:#0e0e0e;--fg:#e6e6e2;--sub:#9b9b96;--mute:#5d5d5a;--faint:#252524;--code:#181817;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#fafaf8;--fg:#1d1d1d;--sub:#6c6c68;--mute:#b2b2ae;--faint:#e7e7e3;--code:#f0f0ec;color-scheme:light}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:17px/1.85 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;letter-spacing:.02em;
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
::selection{background:var(--faint)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
.bar{display:flex;align-items:center;height:52px;padding:0 max(11px,calc((100% - 660px)/2 - 13px));flex:none;transition:opacity .6s}
.bar button{width:44px;height:44px;display:grid;place-items:center;color:var(--sub);transition:color .2s}
.bar button:hover,.bar button:active{color:var(--fg)}
body.w .bar{opacity:0;transition:opacity 1.2s}
#sy{height:44px;padding:0 8px;font-size:12px;letter-spacing:.06em;color:var(--sub);white-space:nowrap}
#sy[hidden]{display:none}
#st{flex:1;text-align:center;font-size:12px;letter-spacing:.08em;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
/* 本文。文字は透明な textarea で受け、真下の pre に同じ文字を飾り付きで描く（下線など）。 */
#ed{flex:1;overflow:auto;padding:8px 0 45vh;cursor:text;--gx:max(24px,calc((100% - 660px)/2))}
.t,.cw{position:relative}
.t pre,.t textarea{display:block;width:100%;margin:0;padding:0 var(--gx);border:0;font:inherit;letter-spacing:inherit;white-space:pre-wrap;overflow-wrap:break-word;tab-size:4}
.t pre{min-height:1.85em;pointer-events:none}
.t textarea,.cw textarea{position:absolute;inset:0;height:100%;resize:none;outline:0;background:transparent;overflow:hidden}
.t textarea{color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--fg)}
.t textarea::selection{background:rgba(128,128,128,.28)}
.t textarea::placeholder{color:transparent;-webkit-text-fill-color:transparent}
#bx>.t:only-child textarea::placeholder{color:var(--mute);-webkit-text-fill-color:var(--mute)}
.t u{text-decoration:underline 1px;text-underline-offset:.32em}
/* 画像（本文の上）とラベル（本文の下）。Google Keep と同じ並び */
#im{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;padding:4px var(--gx) 14px}
#im:empty,#tg:empty,#fl:empty{display:none}
#im img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--faint);cursor:zoom-in}
#tg{display:flex;flex-wrap:wrap;gap:6px;padding:18px var(--gx) 0}
.chip{font-size:13px;letter-spacing:.04em;line-height:1.2;padding:6px 11px;border:1px solid var(--faint);border-radius:999px;color:var(--sub);background:none}
.chip:hover{color:var(--fg)}
#tg button.chip::after{content:"×";margin-left:6px;color:var(--mute)}
input.chip{outline:0;font:inherit;font-size:13px;width:9em;color:var(--fg);border-color:var(--sub)}
.chip.on{color:var(--bg);background:var(--fg);border-color:var(--fg)}
#fl{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;flex:none;scrollbar-width:none}
#fl .chip{white-space:nowrap}
#ls .th{float:right;width:44px;height:44px;object-fit:cover;border-radius:4px;margin:2px 0 0 12px;background:var(--faint)}
#iv{position:fixed;inset:0;z-index:11;display:none;flex-direction:column;background:rgba(0,0,0,.94);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#iv.on{display:flex}
#iv img{flex:1;min-height:0;width:100%;object-fit:contain}
#iv div{display:flex;justify-content:space-between;padding:4px 16px}
#iv button{color:#e6e6e2;font-size:14px;letter-spacing:.06em;padding:14px 8px}
/* コードブロック。中身は普通に見える textarea。pre は高さを決めるためだけにある。 */
.c{margin:10px calc(var(--gx) - 16px);padding:6px 16px 12px;background:var(--code)}
.ch{display:flex;align-items:center;height:28px;font-size:12px;letter-spacing:.06em;color:var(--sub)}
.lg{flex:1;min-width:0;padding:0;border:0;outline:0;background:none;color:inherit;font:inherit;letter-spacing:inherit}
.lg::placeholder{color:var(--mute);opacity:1}
.cp{color:var(--sub);font-size:12px;letter-spacing:.06em;padding:4px 0 4px 12px}
.cp:hover{color:var(--fg)}
.cw pre,.cw textarea{display:block;width:100%;margin:0;padding:0;border:0;font:13.5px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:0;
  white-space:pre-wrap;overflow-wrap:anywhere;tab-size:4;color:var(--fg)}
.cw pre{visibility:hidden;min-height:1.7em}
#dr{position:fixed;inset:0;z-index:9;visibility:hidden;background:var(--bg);opacity:0;transition:opacity .18s,visibility 0s .18s}
#dr.on{visibility:visible;opacity:1;transition:opacity .18s}
#pn{height:100%;max-width:660px;margin:0 auto;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) max(24px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(24px,env(safe-area-inset-left))}
.top{display:flex;align-items:center;gap:8px;height:52px;flex:none;margin-top:16px}
#q{flex:1;min-width:0;padding:6px 0;border:0;border-bottom:1px solid var(--faint);background:none;color:inherit;font:inherit;letter-spacing:inherit;outline:0;border-radius:0;-webkit-appearance:none}
#q:focus{border-color:var(--sub)}
#q::placeholder{color:var(--sub);font-size:.94em}
#q::-webkit-search-cancel-button{display:none}
#bX{width:44px;height:44px;display:grid;place-items:center;color:var(--sub);margin-right:-12px}
#bX:hover{color:var(--fg)}
#ls{flex:1;overflow:auto;list-style:none;padding:4px 0 24px;scrollbar-width:none}
#ls li{color:var(--sub)}
#ls li[data-id]{padding:12px 0 13px;border-bottom:1px solid var(--faint);cursor:pointer}
#ls li.g{padding:24px 0 4px;font-size:12px;letter-spacing:.14em;cursor:default}
#ls li.g:first-child{padding-top:12px}
#ls b{display:block;font-size:16px;line-height:1.6;font-weight:500;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ls li.cur b::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin:0 8px 3px 0}
#ls small{display:block;margin-top:2px;font-size:13px;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ls .d{margin-right:1em;font-variant-numeric:tabular-nums}
@media (hover:hover){#ls li[data-id]:hover b{text-decoration:underline 1px;text-underline-offset:.3em}}
#ls .none{padding:24px 0;font-size:14px}
.ft{display:flex;flex-wrap:wrap;column-gap:24px;padding:8px 0 16px;font-size:13px;letter-spacing:.06em;border-top:1px solid var(--faint)}
.ft button,.ft a{padding:12px 0}
.ft button,.ft a{color:var(--sub);text-decoration:none}
.ft button:hover,.ft a:hover{color:var(--fg)}
.ft a[hidden]{display:none}
/* スマホのキーボードの真上に出る補助バー */
#kb{display:none;flex:none;align-items:center;height:44px;padding:0 max(11px,calc((100% - 660px)/2 - 13px));border-top:1px solid var(--faint)}
body.k #kb{display:flex}
#kb button{width:44px;height:44px;display:grid;place-items:center;color:var(--sub)}
#kb button:active{color:var(--fg)}
#kb .sp{flex:1}
@media (pointer:coarse){#bU,#bC{display:none}}
/* ピン（一覧の上に固定）と通知欄（Android アプリだけ）。押してある間は濃く・塗る */
#bF.on,#bO.on{color:var(--fg)}
#bF.on svg,#bO.on svg{fill:currentColor}
#bO{display:none}
#bO.ok{display:grid}
@media (max-width:420px){.bar button{width:38px}#st{font-size:11px;letter-spacing:.04em}}
@media (max-width:370px){#st{visibility:hidden}}
#to{position:fixed;left:50%;bottom:calc(32px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:13px;letter-spacing:.04em;
  color:var(--bg);background:var(--fg);padding:9px 16px;border-radius:6px;display:none;z-index:12;gap:18px;align-items:center;max-width:calc(100% - 32px)}
#to.on{display:flex}
body.k #to{bottom:calc(60px + env(safe-area-inset-bottom))}
#to button{color:var(--bg);font-weight:600;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
</style>
</head>
<body>
<div class="bar">
  <button id="bL" title="一覧 (Ctrl/⌘+K)" aria-label="一覧"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h9"/></svg></button>

<div id="ed"><div id="im"></div><div id="bx"><div class="t"><pre aria-hidden="true"> </pre><textarea rows="1" autofocus placeholder="メモ" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea></div></div><div id="tg"></div></div>
<datalist id="tl"></datalist>
<div id="kb">
  <button id="kU" aria-label="下線"><svg viewBox="0 0 24 24"><path d="M8 5v6a4 4 0 008 0V5M7 19h10"/></svg></button>
  <button id="kC" aria-label="コードブロック"><svg viewBox="0 0 24 24"><path d="M9 8l-4 4 4 4M15 8l4 4-4 4"/></svg></button>
  <button id="kT" aria-label="字下げ"><svg viewBox="0 0 24 24"><path d="M5 12h12M13 8l4 4-4 4M20 6v12"/></svg></button>
</div>
<div id="dr"><div id="pn">
  <div class="top"><input id="q" type="search" placeholder="検索" autocomplete="off"><button id="bX" title="閉じる (Esc)" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
  <div id="fl"></div>
  <ul id="ls"></ul>
  <div class="ft">
    <button id="bE">書き出し</button>
    <button id="bI">読み込み</button>
    <button id="bY">同期</button>
    <a id="bA" href="../apk/wataamemo.apk" download hidden>Android アプリ</a>
  </div>
</div></div>
<div id="iv"><img alt=""><div><button id="ivD">削除</button><button id="ivX">閉じる</button></div></div>

<script>
// 起動時にやるのは「空の入力欄にカーソルを置く」ことだけ。
// 保存データは1件ずつ別キー（memo:<id>）にあるので、一覧を開くまで読まない。
(function(){
'use strict';
var P='memo:',LS=localStorage,$=function(i){return document.getElementById(i)};
var ed=$('ed'),bx=$('bx'),st=$('st'),dr=$('dr'),q=$('q'),ls=$('ls'),to=$('to');
var curIm=[],curTg=[],curPin=0,cur=null,curU=0,saved='',timer=0,toT=0,undo=null,lastTa=ed.querySelector('textarea');

lastTa.focus();

// iPhone/iPad: 16px 未満の入力欄に触れると画面が拡大されるのを止め、キーボードの分だけ画面を縮める
var iOS=/iP(hone|od|ad)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(iOS){
  var vp=document.querySelector('meta[name=viewport]');vp.content+=',maximum-scale=1';
  if(window.visualViewport){
    var vv=visualViewport,fitVV=function(){if(vv.scale<1.01){document.documentElement.style.height=vv.height+'px';scrollTo(0,0)}};
    vv.addEventListener('resize',fitVV);vv.addEventListener('scroll',fitVV);
  }
}

// ---- エディタ ----
// 本文は「文章ブロック(.t)」と「コードブロック(.c)」の並び。必ず 文章, コード, 文章, … の順で、両端は文章。
// 保存は素のテキスト（Markdown）。コードは ``` で囲む。本文のあとに空行をはさんで、
//   ![](画像/<名前>.jpg)            … 添付した画像（中身は IndexedDB。同期で 画像/ フォルダに置く）
//   #ラベル #ラベル                  … ラベル（Obsidian のタグと同じ書き方）
//   <!-- wataamemo {"u":[[始め,終わり,"下線の文字"],…]} -->  … 下線（本文には記号を入れない）
// を付ける。画面では本文だけを出し、画像は上・ラベルは下に並べる。
// 文章ブロックごとに下線の範囲（何文字目から何文字目まで）を持ち（b._u）、文字を足したり消したりしたらその差から範囲をずらす。
// 前の版は本文に <u>…</u> を書いていたので、読むときはそれも下線として受け取る（次に保存したとき新しい書き方になる）。
var FENCE=/^(?:```|｀｀｀)([^`｀\s]*)\s*$/,CLOSE=/^(?:```|｀｀｀)\s*$/;
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function paint(b){
  var v=b.lastChild.value;
  if(b.className==='t'){
    var h='',p=0;(b._u||[]).forEach(function(x){h+=esc(v.slice(p,x[0]))+'<u>'+esc(v.slice(x[0],x[1]))+'</u>';p=x[1]});
    b.firstChild.innerHTML=h+esc(v.slice(p))+' ';
  }else b.firstChild.textContent=v+' ';
  b.lastChild.scrollTop=0;
}
// 下線の範囲: 並べ替えて、重なり・隣り合いをまとめ、空のものを捨てる
function norm(r){
  var o=[];r.filter(function(x){return x[1]>x[0]}).sort(function(a,b){return a[0]-b[0]}).forEach(function(x){
    var l=o[o.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else o.push([x[0],x[1]]);
  });return o;
}
function cut(r,s,e,sh){return norm(r.map(function(x){return[Math.max(x[0],s)-sh,Math.min(x[1],e)-sh]}))}
// 前の版の保存の形（<u>…</u>）→ 文字と範囲
function unmark(t){
  var o='',r=[],re=/<u>([\s\S]*?)<\/u>/g,last=0,m;
  while((m=re.exec(t))){o+=t.slice(last,m.index);var s=o.length;o+=m[1];r.push([s,o.length]);last=re.lastIndex}
  return{t:o+t.slice(last),r:norm(r)};
}
// 文字が変わったら、変わった所（前後の一致しない部分）に合わせて範囲をずらす。
// 下線の中で打てば下線が伸び、下線の端の外で打っても伸びない
function follow(b,nv,caret){
  var ov=b._v||'',r=b._u||[];b._v=nv;
  if(!r.length||ov===nv)return;
  var ol=ov.length,nl=nv.length,d=nl-ol,a=0,z=0;
  while(a<ol&&a<nl&&ov[a]===nv[a])a++;
  if(caret!=null)a=Math.max(0,Math.min(a,caret-Math.max(d,0)));
  while(z<ol-a&&z<nl-a&&ov[ol-1-z]===nv[nl-1-z])z++;
  var oe=ol-z,ins=nl-z-a;
  b._u=norm(r.map(function(x){
    var s=x[0],e=x[1];
    return[s<a?s:(s>=oe?s+d:a+ins),e<=a?e:(e>=oe?e+d:a)];
  }));
}
function plain(t){return t.replace(/<\/?u>/g,'')}
var IMGL=/^!\[[^\]]*\]\(画像\/([^)\s]+)\)$/,TAGL=/^#[^\s#]+(?:[ \t　]+#[^\s#]+)*$/,METAL=/^<!-- wataamemo (.*) -->$/;
// 保存した全文 → 本文・下線（本文全体での位置）・画像・ラベル
function meta(t){
  var L=t.split('\n'),i=L.length,im=[],tg=[],u=[],pin=0,any=false,m;
  while(i>0){
    var l=L[i-1].trim();
    if(l===''){i--;continue}
    if((m=l.match(METAL))){try{var j=JSON.parse(m[1]);u=j.u||[];pin=j.pin?1:0}catch(e){}}
    else if((m=l.match(IMGL)))im.unshift(m[1]);
    else if(TAGL.test(l))tg=l.split(/[ \t　]+/).map(function(x){return x.slice(1)}).concat(tg);
    else break;
    i--;any=true;
  }
  // 本文のすぐ下（空行なし）に書かれた #… は本文の一部
  if(!any||(i>0&&L[i].trim()!==''))return{t:t,u:[],im:[],tg:[],pin:0};
  var b=L.slice(0,i).join('\n'),r=[];
  // 下線: 書いた文字がその位置に無ければ（ほかのアプリで書き換えられた）、いちばん近い同じ文字に付け直す。無ければ捨てる
  u.forEach(function(x){
    var s=x[0],e=x[1],w=x[2];
    if(typeof w!=='string'||!w){if(e>s)r.push([s,e]);return}
    if(b.slice(s,e)===w){r.push([s,e]);return}
    var best=-1,p=b.indexOf(w);
    while(p>=0){if(best<0||Math.abs(p-s)<Math.abs(best-s))best=p;p=b.indexOf(w,p+1)}
    if(best>=0)r.push([best,best+w.length]);
  });
  tg=tg.filter(function(x,k){return tg.indexOf(x)===k});
  return{t:b,u:norm(r),im:im,tg:tg,pin:pin};
}
function compose(b,u,im,tg,pin){
  var a=[],j={};
  im.forEach(function(n){a.push('![](画像/'+n+')')});
  if(tg.length)a.push(tg.map(function(x){return'#'+x}).join(' '));
  if(!a.length&&!u.length&&!pin)return b;
  b=b.replace(/\s+$/,'');
  u=norm(u.map(function(x){return[x[0],Math.min(x[1],b.length)]}));
  if(u.length)j.u=u.map(function(x){return[x[0],x[1],b.slice(x[0],x[1])]});
  if(pin)j.pin=1;
  if(u.length||pin)a.push('<!-- wataamemo '+JSON.stringify(j)+' -->');
  return(b?b+'\n\n':'')+a.join('\n');
}
function ta(){var x=document.createElement('textarea');x.rows=1;x.spellcheck=false;x.setAttribute('autocomplete','off');x.setAttribute('autocapitalize','off');return x}
function mkT(v,r){
  var d=document.createElement('div'),p=document.createElement('pre'),x=ta();
  d.className='t';p.setAttribute('aria-hidden','true');x.placeholder='メモ';x.value=v;d._v=v;d._u=r||[];d.appendChild(p);d.appendChild(x);paint(d);return d;
}
function mkC(lang,v){

// 文章ブロックを「前の文章 / コード / 後ろの文章」に割る。
// bEnd: 前の文章が元の何文字目で終わるか、aStart: 後ろの文章が元の何文字目から始まるか（下線の範囲を振り分ける）
function split(b,before,lang,code,after,bEnd,aStart){
  var r=b._u||[],L=area(b).value.length;
  var c=mkC(lang,code),t2=mkT(after,cut(r,aStart,L,aStart));
  b._u=cut(r,0,bEnd,0);area(b).value=before;b._v=before;paint(b);

}
// ``` の行のあとで改行された・貼り付けられたらコードブロックにする
function fence(b){
  var first=null;
  for(;;){
    var v=area(b).value,L=v.split('\n'),off=[],o=0,found=false;
    for(var k=0;k<L.length;k++){off.push(o);o+=L[k].length+1}
    for(var i=0;i<L.length-1;i++){
      var m=L[i].match(FENCE);if(!m)continue;
      var j=i+1;while(j<L.length&&!CLOSE.test(L[j]))j++;
      var code=j<L.length?L.slice(i+1,j):[L[i+1]],rs=j<L.length?j+1:i+2;
      var bEnd=i>0?off[i]-1:0,aStart=rs<L.length?off[rs]:v.length;
      var c=split(b,v.slice(0,bEnd),m[1],code.join('\n'),v.slice(aStart),bEnd,aStart);
      if(!first)first=c;
      b=c.nextSibling;found=true;break;
    }
    if(!found)return first;
  }
}
function codeBlock(){
  var x=lastTa,b=blk(x);

}
// 下線: 選んだ所に引く。全部に引いてあれば外す（本文の文字は変えない）
function underline(){
  var x=lastTa,b=blk(x);if(b.className!=='t')return;
  var s=x.selectionStart,e=x.selectionEnd,r=b._u||[];
  x.focus();
  if(s===e){toast('下線を引く文字を選んでから押してください');return}
  if(r.some(function(y){return y[0]<=s&&y[1]>=e})){
    var o=[];r.forEach(function(y){if(y[1]<=s||y[0]>=e){o.push(y);return}if(y[0]<s)o.push([y[0],s]);if(y[1]>e)o.push([e,y[1]])});
    b._u=norm(o);

// コードブロックを消して、前後の文章をつなぐ
function unblock(c){
  var p=c.previousSibling,n=c.nextSibling,a=area(p).value,z=area(n).value,off=a.length+(a&&z?1:0);
  p._u=norm((p._u||[]).concat((n._u||[]).map(function(x){return[x[0]+off,x[1]+off]})));
  area(p).value=a&&z?a+'\n'+z:a+z;p._v=area(p).value;paint(p);c.remove();n.remove();put(area(p),a.length);changed();
}

// ---- 保存と一覧 ----
function nid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function get(id){try{return JSON.parse(LS.getItem(P+id))}catch(e){return null}}
// 書き込みは必ず setM / rmM を通す。変更したメモの ID を送信待ち（memo.q）に残し、
// オフラインの間もたまっていく。同期（sync.js。OneDrive / GitHub）がこれを見て送る。
var Q='memo.q';
function getQ(){var q=null;try{q=JSON.parse(LS.getItem(Q))}catch(e){}q=q||{};q.dirty=q.dirty||{};q.del=q.del||{};return q}
function mark(id,gone){var q=getQ();if(gone){q.del[id]=1;delete q.dirty[id]}else{q.dirty[id]=1;delete q.del[id]}LS.setItem(Q,JSON.stringify(q));if(window.MemoSync)MemoSync.kick()}
function setM(id,m){LS.setItem(P+id,JSON.stringify(m));mark(id)}

function all(){

function fmt(ms){
  var d=new Date(ms),n=new Date(),p=function(v){return(v<10?'0':'')+v};
  var hm=p(d.getHours())+':'+p(d.getMinutes());
  if(d.toDateString()===n.toDateString())return hm;
  return(d.getFullYear()===n.getFullYear()?'':d.getFullYear()+'/')+(d.getMonth()+1)+'/'+d.getDate()+' '+hm;
}
function status(){

// 保存。中身が空になったメモは消す（空メモを溜めない）。
function save(){
  clearTimeout(timer);timer=0;
  var t=getText();
  if(t===saved)return;
  if(!t.trim()){if(cur){rmM(cur);note(cur)}cur=null;saved=t;status();return}
  var now=Date.now(),old=cur&&get(cur);
  if(!cur)cur=nid();
  try{setM(cur,{t:t,c:old?old.c:now,u:now});saved=t;curU=now;keep();note(cur)}
  catch(e){toast('保存できません（容量不足）。書き出してから古いメモを消してください')}

}
function later(){clearTimeout(timer);timer=setTimeout(save,250)}
// ブラウザの容量整理でメモが消されないよう、保存領域の保護を一度だけ頼む（Firefox は確認画面が出るので除く）
var kept=false;
function keep(){
  if(kept||!navigator.storage||!navigator.storage.persist||/Firefox/.test(navigator.userAgent))return;
  kept=true;navigator.storage.persisted().then(function(p){if(!p)navigator.storage.persist()}).catch(function(){});
}

// ---- 画像 ----
// 画像は小さくして（長い辺 1600px の JPEG）IndexedDB に入れる。localStorage には名前だけ。
var idb=null,urls={};
function db(){
  return idb||(idb=new Promise(function(ok,ng){
    var r=indexedDB.open('wataamemo',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('img')};
    r.onsuccess=function(){ok(r.result)};r.onerror=function(){idb=null;ng(r.error)};
  }));
}
function imOp(mode,fn){
  return db().then(function(d){return new Promise(function(ok,ng){
    var t=d.transaction('img',mode),r=fn(t.objectStore('img'));
    t.oncomplete=function(){ok(r&&r.result)};t.onerror=t.onabort=function(){ng(t.error)};
  })});
}
var IM={
  get:function(n){return imOp('readonly',function(s){return s.get(n)})},
  put:function(n,b){return imOp('readwrite',function(s){return s.put(b,n)})},
  keys:function(){return imOp('readonly',function(s){return s.getAllKeys()})}
};
function imgURL(n){
  if(urls[n])return Promise.resolve(urls[n]);
  return IM.get(n).then(function(b){return b?(urls[n]=URL.createObjectURL(b)):''},function(){return''});
}
function drawIm(){
  var box=$('im');box.textContent='';
  curIm.forEach(function(n){
    var i=document.createElement('img');i.alt='';i.setAttribute('data-n',n);box.appendChild(i);
    imgURL(n).then(function(u){if(u)i.src=u});
  });
}
function shrink(f){
  var viaImg=function(){return new Promise(function(ok,ng){var i=new Image();i.onload=function(){ok(i)};i.onerror=ng;i.src=URL.createObjectURL(f)})};
  return(window.createImageBitmap?createImageBitmap(f).catch(viaImg):viaImg()).then(function(b){
    var w=b.width,h=b.height,k=Math.min(1,1600/Math.max(w,h)),c=document.createElement('canvas'),x=c.getContext('2d');
    c.width=Math.round(w*k);c.height=Math.round(h*k);
    x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0,c.width,c.height);
    return new Promise(function(ok,ng){c.toBlob(function(r){r?ok(r):ng()},'image/jpeg',.82)});
  });
}
function addImages(){
  var f=document.createElement('input');f.type='file';f.accept='image/*';f.multiple=true;
  f.onchange=function(){

    fs.reduce(function(p,file){

      }).catch(function(){toast('読み込めない画像がありました')});
    },Promise.resolve()).then(function(){drawIm();save();status()});

}

// 一覧。更新が新しい順に、今日・昨日・この1週間・月ごとの見出しを付ける
function day0(t){var d=new Date(t);d.setHours(0,0,0,0);return +d}
function group(u){
  var t=day0(Date.now()),d=day0(u),n=new Date(u);
  if(d>=t)return'今日';if(d>=t-864e5)return'昨日';if(d>t-7*864e5)return'この1週間';
  return(n.getFullYear()===new Date().getFullYear()?'':n.getFullYear()+'年')+(n.getMonth()+1)+'月';
}
function when(u){
  var d=new Date(u),g=group(u),p=function(v){return(v<10?'0':'')+v};
  return g==='今日'||g==='昨日'?p(d.getHours())+':'+p(d.getMinutes()):(d.getMonth()+1)+'月'+d.getDate()+'日';
}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
// 上にラベルを並べ、押すとそのラベルのメモだけにする
var fTag='';
function render(){
  var w=q.value.trim().toLowerCase(),a=all(),pn={},f=document.createDocumentFragment(),n=0,last='',tags=allTags(),fl=$('fl');
  if(tags.indexOf(fTag)<0)fTag='';
  fl.textContent='';
  if(tags.length)['すべて'].concat(tags).forEach(function(t,k){var c=el('button','chip'+((k?t:'')===fTag?' on':''),t);c.setAttribute('data-t',k?t:'');fl.appendChild(c)});
  a.forEach(function(m){if(meta(m.t).pin)pn[m.id]=1});
  a=a.filter(function(m){return pn[m.id]}).concat(a.filter(function(m){return!pn[m.id]}));
  for(var i=0;i<a.length;i++){
    var mt=meta(a[i].t),t=mt.t;
    if(fTag&&mt.tg.indexOf(fTag)<0)continue;
    if(w&&(t+'\n'+mt.tg.join(' ')).toLowerCase().indexOf(w)<0)continue;
    var lines=t.replace(/^```.*$/gm,'').trim().split('\n'),head=lines[0].slice(0,80),rest=lines.slice(1).join(' ').replace(/\s+/g,' ').trim().slice(0,80);
    if(!head&&mt.im.length)head='画像';
    var g=mt.pin?'固定':group(a[i].u);
    if(g!==last){f.appendChild(el('li','g',g));last=g}
    // 本文は textContent で入れる（HTML として解釈させない）
    var li=el('li',a[i].id===cur?'cur':''),sm=el('small');
    li.setAttribute('data-id',a[i].id);
    sm.appendChild(el('span','d',when(a[i].u)));if(rest)sm.appendChild(document.createTextNode(rest));
    if(mt.im.length){var th=el('img','th');th.alt='';li.appendChild(th);(function(th){imgURL(mt.im[0]).then(function(u){if(u)th.src=u})})(th)}
    if(mt.tg.length)sm.appendChild(document.createTextNode((rest?' · ':'')+mt.tg.map(function(x){return'#'+x}).join(' ')));
    li.appendChild(el('b','',head||'無題'));li.appendChild(sm);f.appendChild(li);n++;
  }
  ls.textContent='';
  ls.appendChild(n?f:el('li','none',w||fTag?'見つかりません':'メモはまだありません'));
  q.placeholder='検索'+(a.length?'（'+a.length+'件）':'');
}
function openList(){save();wake();q.value='';render();dr.className='on';if(matchMedia('(hover:hover)').matches)q.focus()}

function back(){close();lastTa.focus()}
window.WataaBack=function(){
  var p=document.getElementById('syp');

  if($('iv').className){$('iv').className='';return true}
  if(dr.className){back();return true}

};

// 書いている間はバーを消して文字だけにする。手が止まるかマウスが動けば戻す。
var wT=0,mx=-1,my=-1,B=document.body;

function wake(){clearTimeout(wT);B.classList.remove('w')}
addEventListener('mousemove',function(e){if(Math.abs(e.screenX-mx)+Math.abs(e.screenY-my)>4&&mx>=0)wake();mx=e.screenX;my=e.screenY});
// 下線・コードのボタンを押しても入力欄のフォーカスと選択範囲を失わない
['bU','bC','kU','kC','kT','bT','bF','bO'].forEach(function(i){$(i).onmousedown=$(i).onpointerdown=function(e){e.preventDefault()}});
$('kU').onclick=underline;
$('kC').onclick=codeBlock;
$('kT').onclick=function(){ins(lastTa,'\t')};
$('bU').onclick=underline;
$('bC').onclick=codeBlock;

$('bX').onclick=back;
$('bN').onclick=function(){open(null)};
$('bD').onclick=function(){

  if(!cur){load('');curU=0;put(area(bx.firstChild),0);status();return}

$('tu').onclick=function(){if(undo)undo();to.className='';undo=null};
// Android アプリ（WataaApp）の中では、共有・コピー・書き出しをアプリ側に頼む（WebView では使えないため）

dr.onclick=function(e){if(e.target===dr)close()};
q.oninput=render;

q.onkeydown=function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();var f=ls.querySelector('li[data-id]');if(f)open(f.getAttribute('data-id'))}};

$('bE').onclick=function(){
  var a=all().map(function(m){return{id:m.id,t:m.t,c:m.c,u:m.u}});
  var b=new Blob([JSON.stringify({app:'memo',v:1,memos:a},null,1)],{type:'application/json'});
  var x=document.createElement('a'),d=new Date(),name='memo-'+d.getFullYear()+(d.getMonth()+101+'').slice(1)+(d.getDate()+100+'').slice(1)+'.json';
  if(window.WataaApp){b.text().then(function(t){WataaApp.saveFile(name,t)});return}
  x.href=URL.createObjectURL(b);x.download=name;
  x.click();setTimeout(function(){URL.revokeObjectURL(x.href)},1000);

$('bI').onclick=function(){
  var f=document.createElement('input');f.type='file';f.accept='.json,.txt,.md,application/json,text/plain';
  f.onchange=function(){
    var file=f.files[0];if(!file)return;
    file.text().then(function(s){
      save();
      var n=0,now=Date.now();
      try{
        var d=JSON.parse(s),a=Array.isArray(d)?d:d&&d.memos;
        if(!Array.isArray(a)){toast('このファイルは読み込めません');return}
        a.forEach(function(m){
          if(!m||typeof m.t!=='string'||!m.t.trim())return;
          var id=m.id||nid(),ex=get(id);
          if(ex&&ex.u>=(m.u||0))return; // 手元の方が新しければ上書きしない
          setM(id,{t:m.t,c:m.c||now,u:m.u||now});n++;
          if(id===cur){curU=m.u||now;load(m.t)}
        });
      }catch(e){
        if(!s.trim())return;
        if(/^\s*[\[{]/.test(s)){toast('このファイルは読み込めません');return}
        setM(nid(),{t:s,c:now,u:now});n=1; // 普通のテキストは1件のメモとして取り込む
      }
      render();toast(n+'件読み込みました');
    });
  };
  f.click();
};

document.addEventListener('keydown',function(e){
  var mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(mod&&k==='k'){e.preventDefault();dr.className?back():openList()}
  else if(mod&&k==='s'){e.preventDefault();save();toast('保存しました')}
  else if(mod&&!e.shiftKey&&!e.altKey&&k==='u'){e.preventDefault();if(!dr.className)underline()}
  else if(e.altKey&&(k==='n'||e.code==='KeyN')){e.preventDefault();open(null)}
  else if(e.altKey&&(k==='c'||e.code==='KeyC')&&!dr.className){e.preventDefault();codeBlock()}
  else if(k==='escape'&&$('iv').className)$('iv').className='';
  else if(k==='escape'&&dr.className)back();
});

// 閉じる・裏に回る瞬間に必ず書き込む
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',function(){if(document.hidden)save()});
// 別タブで同じメモが書き換わったら、こちらが未編集のときだけ追従する
addEventListener('storage',function(e){
  if(!cur||e.key!==P+cur||getText()!==saved)return;
  var m=get(cur);if(!m){cur=null;curU=0;load('')}else{curU=m.u;load(m.t)}status();
});

// ---- OS からの呼び出し ----
// 他のアプリの「共有」から来た文字を新しいメモにする。?list はアイコン長押しの「一覧」。
(function(){
  if(!location.search||/[?&](code|error)=/.test(location.search))return;
  var u=new URLSearchParams(location.search),t=(u.get('text')||'').trim(),ti=(u.get('title')||'').trim(),url=(u.get('url')||'').trim(),a=[];
  if(ti&&t.indexOf(ti)!==0)a.push(ti);
  if(t)a.push(t);
  if(url&&t.indexOf(url)<0)a.push(url);
  history.replaceState(null,'',location.pathname);
  if(a.length){load(a.join('\n'));saved='';save();put(area(bx.lastChild),'end');toast('共有から追加しました')}
  else if(u.get('open')&&get(u.get('open')))open(u.get('open'));
  else if(u.has('list'))openList();
})();
// インストール後、.txt / .md を「このアプリで開く」と1件ずつメモとして取り込む
if('launchQueue' in window)launchQueue.setConsumer(function(p){
  if(!p.files||!p.files.length)return;
  Promise.all(p.files.map(function(h){return h.getFile().then(function(f){return f.text()})})).then(function(ts){
    save();var last=null,now=Date.now();
    ts.forEach(function(t){if(t.trim()){last=nid();setM(last,{t:t,c:now,u:now})}});
    if(last)open(last);
  });
});

// ---- 同期（OneDrive / GitHub） ----
// 同期の処理は sync.js にある。設定済みのときだけ、描画が終わってから読む（起動の速さに影響させない）。
window.MEMO={
  P:P,get:get,all:all,meta:meta,img:IM,imgs:function(){drawIm();if(dr.className)render()},nid:nid,getQ:getQ,setM:setM,save:save,toast:toast,fmt:fmt,sy:$('sy'),
  putRaw:function(id,m){LS.setItem(P+id,JSON.stringify(m))},     // GitHub から取り込んだ分（送信待ちにしない）
  rmRaw:function(id){LS.removeItem(P+id)},
  unq:function(id,kind){var q=getQ();delete q[kind][id];LS.setItem(Q,JSON.stringify(q))},
  // GitHub 側の変更を画面に反映する。開いているメモは、こちらで書きかけでなければ読み直す
  remote:function(id){
    if(id===cur&&getText()===saved){var m=get(id);if(!m){cur=null;curU=0;load('')}else{curU=m.u;load(m.t)}status()}
    note(id);
    if(dr.className)render();
  }
};
function loadSync(cb){
  if(window.MemoSync){if(cb)cb();return}
  var x=document.createElement('script');x.src='sync.js';x.onload=function(){if(cb)cb()};
  x.onerror=function(){toast('同期の部品を読み込めませんでした（オフライン？）')};document.head.appendChild(x);
}
// Android のブラウザで開いているときだけ、アプリ（APK）の入手先を出す

  if(/[?&](code|error)=/.test(location.search))loadSync();   // サインインから戻ってきた: すぐ受け取る
  else addEventListener('load',function(){setTimeout(loadSync,300)});
}

// Service Worker は描画が終わってから。起動の邪魔をしない。
// Android アプリ（WataaApp）の中では画面をアプリに同梱しているので使わない。
// 新しい版が届いたら（裏で入れ替わったら）、書きかけを保存して読み直す。
// 起動直後の古い版のまま同期して、別の版と食い違うのを防ぐため。打ち始めていたら、次に画面に戻ったときに読み直す。
if('serviceWorker' in navigator&&!window.WataaApp){
  var hadSW=!!navigator.serviceWorker.controller,typed=false,stale=false;
  ed.addEventListener('input',function(){typed=true},{once:true});
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!hadSW)return;
    save();if(!typed)location.reload();else stale=true;
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&stale){save();location.reload()}});
  addEventListener('load',function(){setTimeout(function(){navigator.serviceWorker.register('sw.js').catch(function(){})},1000)});
}
})();
